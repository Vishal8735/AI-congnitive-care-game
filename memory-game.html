<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Match - MindCare AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #fdf2f8);
            text-align: center;
            color: #222;
        }

        header {
            background: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 10px #ccc;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #4f46e5;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            color: #4f46e5;
        }

        .stats {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 25px 0;
        }

        .stat {
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 12px #ddd;
            min-width: 100px;
        }

        .stat strong {
            display: block;
            font-size: 22px;
            margin-top: 5px;
            color: #4f46e5;
        }

        #gameBoard {
            display: grid;
            grid-template-columns: repeat(4, 90px);
            gap: 15px;
            justify-content: center;
            margin: 30px 0;
        }

        .card {
            width: 90px;
            height: 90px;
            border: none;
            border-radius: 15px;
            background: #4f46e5;
            color: white;
            font-size: 35px;
            cursor: pointer;
            box-shadow: 0 5px 10px #bbb;
        }

        .card:hover {
            transform: scale(1.05);
        }

        #result {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #ccc;
            margin-top: 25px;
        }

        button.action {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            font-size: 16px;
            margin: 8px;
        }

        button.action:hover {
            background: #3730a3;
        }

        @media(max-width:600px) {
            #gameBoard {
                grid-template-columns: repeat(4, 65px);
                gap: 10px;
            }

            .card {
                width: 65px;
                height: 65px;
                font-size: 25px;
            }
        }
    </style>

</head>

<body>

<header>

    <div class="logo">
        🧠 MindCare AI
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
    </nav>

</header>


<div class="container">

    <h1>🧩 Memory Match</h1>

    <p>Find all matching pairs!</p>


    <div class="stats">

        <div class="stat">
            Score
            <strong id="gameScore">0</strong>
        </div>

        <div class="stat">
            Time
            <strong><span id="timer">0</span>s</strong>
        </div>

        <div class="stat">
            Attempts
            <strong id="attempts">0</strong>
        </div>

        <div class="stat">
            Accuracy
            <strong><span id="gameAccuracy">0</span>%</strong>
        </div>

    </div>
    <div id="gameBoard" class="game-board"></div>


    <div id="gameBoard"></div>


    <button class="action" onclick="restartGame()">
        🔄 Restart Game
    </button>

    <a href="games.html">
        <button class="action">
            🎮 Back to Games
        </button>
    </a>


    <div id="result">

        <h2>🎉 Game Complete!</h2>

        <p>Score: <strong id="finalScore">0</strong></p>

        <p>Time: <strong id="finalTime">0</strong> seconds</p>

        <p>Attempts: <strong id="finalAttempts">0</strong></p>

        <p>Accuracy: <strong id="finalAccuracy">0%</strong></p>

        
        <button class="action" onclick="restartGame()">
            🔄 Play Again
        </button>

        

    </div>

</div>

<script src="memory-game.js"></script>


</body>
</html>
